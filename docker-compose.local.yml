version: '3.8'

# Lightweight local mode: no Postgres, Redis, Prometheus or Grafana.
# Uses the SQLite default (DATABASE_URL unset) and the agent's local
# JSON/FAISS memory store. Run with:
#   docker compose -f docker-compose.local.yml up

services:
  mcp-server:
    build: .
    container_name: mcp-server
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - .:/app
    command: python -m mcp_server.server

  backend:
    build: .
    container_name: backend
    ports:
      - "8001:8001"
    env_file: .env
    volumes:
      - .:/app
    depends_on:
      - mcp-server
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8001 --reload

  frontend:
    image: node:22
    container_name: frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend-angular:/app
    working_dir: /app
    command: sh -c "npm install && npx ng serve --host 0.0.0.0 --port 3000 --proxy-config proxy.conf.docker.json"
    depends_on:
      - backend
